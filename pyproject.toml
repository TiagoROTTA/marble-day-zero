[project]
name = "day-zero"
version = "0.1.0"
description = "Restaurant public website to a reviewed back-of-house model and a draft opening purchase order"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.67,<0.3",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "slack-sdk>=3.33",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
